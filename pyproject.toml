[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macosvm"
version = "0.1.0"
description = "Make and manage macOS VMs on Linux, with reims-vgpu's virtual GPU"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "the macosvm contributors" }]
keywords = ["macos", "kvm", "qemu", "opencore", "vgpu", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Emulators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Axelthebat/macos-vm-manager"
Source = "https://github.com/Axelthebat/macos-vm-manager"
Issues = "https://github.com/Axelthebat/macos-vm-manager/issues"

[project.scripts]
macosvm = "macosvm.cli:main"

[tool.setuptools.packages.find]
include = ["macosvm*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Os testes usam nomes com sublinhado, como unittest espera.
"tests/*" = ["N802"]
